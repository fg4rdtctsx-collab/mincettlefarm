openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /visits:
    post:
      operationId: recordVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitInput" }
      responses:
        "200":
          description: Anonymous page view accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /owner/analytics:
    get:
      operationId: getOwnerAnalytics
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [daily, monthly] } }
        - { name: month, in: query, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
        - { name: year, in: query, schema: { type: integer, minimum: 2020, maximum: 2100 } }
      responses:
        "200":
          description: Confirmed sales and anonymous visitor sessions in Africa/Lagos time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerAnalytics" }
  /checkout/config:
    get:
      operationId: getCheckoutConfig
      responses:
        "200":
          description: Sandbox availability and server-owned test catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutConfig" }
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Persistent sandbox order and invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private receipt with freshly reconciled payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderReceipt" }
        "404": { $ref: "#/components/responses/Error" }
  /owner/orders:
    get:
      operationId: getOwnerOrders
      responses:
        "200":
          description: Owner-only order records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerOrder" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /owner/inventory:
    get:
      operationId: getOwnerInventory
      responses:
        "200":
          description: Protected livestock inventory including reservations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OwnerLivestock" } }
    post:
      operationId: createOwnerLivestock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LivestockInput" }
      responses:
        "201":
          description: Created livestock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerLivestock" }
  /owner/inventory/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateOwnerLivestock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LivestockUpdate" }
      responses:
        "200":
          description: Updated livestock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerLivestock" }
    delete:
      operationId: archiveOwnerLivestock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LivestockArchive" }
      responses:
        "200":
          description: Archived without deleting order history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerLivestock" }
  /owner/orders/{id}/action:
    post:
      operationId: actOnOwnerOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderAction" }
      responses:
        "200":
          description: Owner-reviewed bank payment or fulfillment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderReceipt" }
  /owner/images:
    post:
      operationId: uploadOwnerImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImageInput" }
      responses:
        "201":
          description: Persisted livestock photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageUpload" }
  /payments/oxapay/callback:
    post:
      operationId: receiveOxapayCallback
      description: Raw JSON body, verified HMAC-SHA512 signature; server reconciliation before changes.
      responses:
        "200":
          description: Durable acknowledgement
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    Error:
      description: Request cannot be processed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiFailure" }
  schemas:
    ApiFailure:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CatalogItem:
      type: object
      required: [id, name, price, available]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        available: { type: integer }
        reserved: { type: integer }
        active: { type: boolean }
        slug: { type: string }
        category: { type: string }
        description: { type: string }
        images: { type: array, items: { type: string } }
    CheckoutConfig:
      type: object
      required: [available, sandbox, message, products]
      properties:
        available: { type: boolean }
        bankAvailable: { type: boolean }
        sandbox: { type: boolean }
        message: { type: string }
        products:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
    OrderLineInput:
      type: object
      required: [id, qty]
      properties:
        id: { type: integer, minimum: 1 }
        qty: { type: integer, minimum: 1, maximum: 10 }
    Buyer:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 200 }
        phone: { type: string, minLength: 5, maxLength: 40 }
    OrderInput:
      type: object
      required: [buyer, lines, idempotencyKey]
      properties:
        buyer: { $ref: "#/components/schemas/Buyer" }
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/OrderLineInput" }
        idempotencyKey: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [crypto, bank] }
    OrderLine:
      type: object
      required: [id, name, qty, unitPrice]
      properties:
        id: { type: integer }
        name: { type: string }
        qty: { type: integer }
        unitPrice: { type: number }
    OrderReceipt:
      type: object
      required: [id, status, total, currency, sandbox, lines, paymentUrl, trackId, expiresAt, createdAt, message]
      properties:
        id: { type: string }
        status: { type: string, enum: [creating, pending, paying, paid, expired, failed, review] }
        total: { type: number }
        currency: { type: string }
        sandbox: { type: boolean }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        paymentUrl: { type: [string, "null"] }
        trackId: { type: [string, "null"] }
        expiresAt: { type: string }
        createdAt: { type: string }
        paidAt: { type: [string, "null"] }
        message: { type: string }
        paymentMethod: { type: string, enum: [crypto, bank] }
        bankEmailUrl: { type: [string, "null"] }
        fulfilledAt: { type: [string, "null"] }
    OwnerLivestock:
      allOf:
        - { $ref: "#/components/schemas/CatalogItem" }
        - type: object
          required: [stock, reserved, active, version, category, description, images, slug]
          properties:
            stock: { type: integer }
            reserved: { type: integer }
            active: { type: boolean }
            version: { type: integer }
            category: { type: string }
            description: { type: string }
            images: { type: array, items: { type: string } }
            slug: { type: string }
    LivestockInput:
      type: object
      required: [name, price, stock, category, description, images]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        active: { type: boolean }
        price: { type: number, minimum: 0.01, maximum: 1000000 }
        stock: { type: integer, minimum: 0, maximum: 1000 }
        category: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 10000 }
        images: { type: array, maxItems: 8, items: { type: string, maxLength: 2000 } }
    LivestockUpdate:
      allOf:
        - { $ref: "#/components/schemas/LivestockInput" }
        - type: object
          required: [version, active, expectedStock]
          properties:
            version: { type: integer, minimum: 0 }
            active: { type: boolean }
            expectedStock: { type: integer, minimum: 0 }
    LivestockArchive:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0 }
    OrderAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [confirm_bank, cancel_bank, fulfill] }
    ImageInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    ImageUpload:
      type: object
      required: [url]
      properties:
        url: { type: string }
    VisitInput:
      type: object
      required: [eventId, sessionId, path]
      properties:
        eventId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        path: { type: string, maxLength: 200 }
        referrer: { type: string, maxLength: 200 }
    AnalyticsBucket:
      type: object
      required: [bucket, revenue, paidOrders, visitors, pageViews]
      properties:
        bucket: { type: string }
        revenue: { type: number }
        paidOrders: { type: integer }
        visitors: { type: integer }
        pageViews: { type: integer }
    AnalyticsPage:
      type: object
      required: [path, views]
      properties:
        path: { type: string }
        views: { type: integer }
    OwnerAnalytics:
      type: object
      required: [period, timezone, trackingStartedAt, totals, buckets, topPages]
      properties:
        period: { type: string, enum: [daily, monthly] }
        timezone: { type: string }
        trackingStartedAt: { type: string }
        totals: { $ref: "#/components/schemas/AnalyticsBucket" }
        buckets: { type: array, items: { $ref: "#/components/schemas/AnalyticsBucket" } }
        topPages: { type: array, items: { $ref: "#/components/schemas/AnalyticsPage" } }
    OrderSession:
      type: object
      required: [order, accessToken]
      properties:
        order: { $ref: "#/components/schemas/OrderReceipt" }
        accessToken: { type: string }
    OwnerOrder:
      type: object
      required: [order, buyer]
      properties:
        order: { $ref: "#/components/schemas/OrderReceipt" }
        buyer: { $ref: "#/components/schemas/Buyer" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

