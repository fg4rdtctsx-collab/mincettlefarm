openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /checkout/config:
    get:
      operationId: getCheckoutConfig
      responses:
        "200":
          description: Sandbox availability and server-owned test catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutConfig" }
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Persistent sandbox order and invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSession" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private receipt with freshly reconciled payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderReceipt" }
        "404": { $ref: "#/components/responses/Error" }
  /owner/orders:
    get:
      operationId: getOwnerOrders
      responses:
        "200":
          description: Owner-only order records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerOrder" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /payments/oxapay/callback:
    post:
      operationId: receiveOxapayCallback
      description: Raw JSON body, verified HMAC-SHA512 signature; server reconciliation before changes.
      responses:
        "200":
          description: Durable acknowledgement
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    Error:
      description: Request cannot be processed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiFailure" }
  schemas:
    ApiFailure:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CatalogItem:
      type: object
      required: [id, name, price, available]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        available: { type: integer }
    CheckoutConfig:
      type: object
      required: [available, sandbox, message, products]
      properties:
        available: { type: boolean }
        sandbox: { type: boolean }
        message: { type: string }
        products:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
    OrderLineInput:
      type: object
      required: [id, qty]
      properties:
        id: { type: integer, minimum: 1 }
        qty: { type: integer, minimum: 1, maximum: 10 }
    Buyer:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 200 }
        phone: { type: string, minLength: 5, maxLength: 40 }
    OrderInput:
      type: object
      required: [buyer, lines, idempotencyKey]
      properties:
        buyer: { $ref: "#/components/schemas/Buyer" }
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/OrderLineInput" }
        idempotencyKey: { type: string, format: uuid }
    OrderLine:
      type: object
      required: [id, name, qty, unitPrice]
      properties:
        id: { type: integer }
        name: { type: string }
        qty: { type: integer }
        unitPrice: { type: number }
    OrderReceipt:
      type: object
      required: [id, status, total, currency, sandbox, lines, paymentUrl, trackId, expiresAt, createdAt, message]
      properties:
        id: { type: string }
        status: { type: string, enum: [creating, pending, paying, paid, expired, failed, review] }
        total: { type: number }
        currency: { type: string }
        sandbox: { type: boolean }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        paymentUrl: { type: [string, "null"] }
        trackId: { type: [string, "null"] }
        expiresAt: { type: string }
        createdAt: { type: string }
        message: { type: string }
    OrderSession:
      type: object
      required: [order, accessToken]
      properties:
        order: { $ref: "#/components/schemas/OrderReceipt" }
        accessToken: { type: string }
    OwnerOrder:
      type: object
      required: [order, buyer]
      properties:
        order: { $ref: "#/components/schemas/OrderReceipt" }
        buyer: { $ref: "#/components/schemas/Buyer" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

